name: Pete Roome
description: "Writing about building products with AI, from the inside."
url: https://peteroome.com
baseurl: ''
include: [.htaccess]

author:
  name: Pete Roome
  title: CTO at Carpata
  bio: "CTO at Carpata. Building AI-native tools for automotive parts procurement. Writing about what works and what doesn't in AI-native product development."
  linkedin: https://www.linkedin.com/in/peteroome/
  github: https://github.com/peteroome

permalink: /:year/:month/:day/:title/
paginate: 5
highlighter: rouge

sass:
  style: compressed

plugins:
  - jekyll-redirect-from
  - jekyll-paginate
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
